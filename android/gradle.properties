org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
# 彻底禁用 daemon，避开 TRAE sandbox .lock 写入限制 & daemon 卡住
org.gradle.daemon=false
# 禁用 parallel，单线程稳定优先
org.gradle.parallel=false
org.gradle.workers.max=1
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable Kotlin incremental compilation to avoid cross-drive issues
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
